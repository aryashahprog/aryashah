<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ page.title }}</title>
<meta name="author" content="{{ page.authors }}">
<style>
  @page { size: Letter; }
  html { font-family: Arial, "Liberation Sans", Helvetica, sans-serif; font-size: 10.5pt; line-height: 1.45; color: #000; }
  body { margin: 0; }
  a { color: #000; text-decoration: none; }
  h1 { font-size: 17pt; line-height: 1.22; margin: 0 0 10pt; }
  .authors { font-size: 11pt; margin: 0 0 3pt; }
  .affiliations { font-size: 9.5pt; margin: 0 0 10pt; }
  .source { font-size: 8.5pt; line-height: 1.4; margin: 0; color: #333; }
  .header { border-bottom: 0.75pt solid #000; padding-bottom: 10pt; margin-bottom: 12pt; }
  .abstract { border-bottom: 0.75pt solid #000; padding-bottom: 6pt; margin-bottom: 4pt; font-size: 9.75pt; }
  .abstract h2 { margin-top: 0; }
  h2 { font-size: 11.5pt; margin: 14pt 0 5pt; break-after: avoid; }
  h3 { font-size: 10.5pt; font-style: italic; font-weight: normal; margin: 9pt 0 3pt; break-after: avoid; }
  p { margin: 0 0 6pt; orphans: 3; widows: 3; }
  p:has(+ table) { font-size: 9pt; margin: 8pt 0 3pt; break-after: avoid; }
  table { width: 100%; border-collapse: collapse; margin: 0 0 10pt; font-size: 9pt; break-inside: avoid; }
  th, td { text-align: left; vertical-align: top; padding: 2.5pt 8pt 2.5pt 0; }
  th { border-top: 1pt solid #000; border-bottom: 0.5pt solid #000; font-weight: bold; }
  tbody tr:last-child td { border-bottom: 1pt solid #000; }
  th[align="right"], td[align="right"] { text-align: right; padding-right: 0; padding-left: 8pt; }
  sup { font-size: 70%; line-height: 0; }
  figure { margin: 10pt 0 12pt; break-inside: avoid; }
  figure img { display: block; width: 100%; height: auto; }
  figure.narrow img { width: 86%; margin: 0 auto; }
  figcaption { font-size: 9pt; line-height: 1.4; margin-top: 5pt; }
  .references { font-size: 8.75pt; line-height: 1.4; padding-left: 16pt; margin: 0; }
  .references li { margin: 0 0 3pt; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="header">
  <h1>{{ page.title }}</h1>
  <p class="authors">{{ page.authors }}</p>
  <p class="affiliations">{{ page.affiliations }}</p>
  <p class="source">{{ page.source_note }}</p>
</div>
{{ page.html | safe }}
</body>
</html>
