<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ page.title }}</title>
<meta name="author" content="{{ page.authors }}">
<style>
  @page { size: Letter; margin: 0.9in 1in 0.9in 1in; }
  html { font-family: Arial, "Liberation Sans", Helvetica, sans-serif; font-size: 10.5pt; line-height: 1.45; color: #000; }
  body { margin: 0; }
  a { color: #000; text-decoration: none; }
  .status { font-size: 9pt; margin: 0 0 18pt; text-transform: uppercase; letter-spacing: 0.04em; }
  h1 { font-size: 16pt; line-height: 1.25; margin: 0 0 10pt; }
  .byline { margin: 0 0 4pt; }
  .note { font-size: 9pt; margin: 4pt 0; }
  h2 { font-size: 12pt; margin: 18pt 0 6pt; break-after: avoid; }
  h3 { font-size: 10.5pt; font-style: italic; font-weight: normal; margin: 10pt 0 4pt; break-after: avoid; }
  p { margin: 0 0 7pt; text-align: left; orphans: 3; widows: 3; }
  ul, ol { margin: 0 0 7pt; padding-left: 18pt; }
  li { margin: 0 0 3pt; }
  ol li { overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; margin: 4pt 0 10pt; font-size: 9.5pt; break-inside: avoid; }
  th, td { text-align: left; vertical-align: top; padding: 3pt 6pt 3pt 0; border-bottom: 0.5pt solid #000; }
  th { border-top: 1pt solid #000; border-bottom: 1pt solid #000; }
  code { font-family: "Liberation Mono", "Courier New", monospace; font-size: 9.5pt; }
  .header { border-bottom: 0.75pt solid #000; padding-bottom: 12pt; margin-bottom: 6pt; }
</style>
</head>
<body>
<div class="header">
  <p class="status">{{ page.status }} · {{ page.updated | date }}</p>
  <h1>{{ page.title }}</h1>
  <p class="byline">{{ page.authors }}</p>
  <p class="byline">{{ page.affiliations }}</p>
  <p class="note">{{ page.author_note }}</p>
  <p class="note">{{ page.source_note }}</p>
</div>
{{ page.html | safe }}
</body>
</html>
