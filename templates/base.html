<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Arya Shah{% endblock %}</title>
  <meta name="description" content="{% block description %}Arya Shah: Georgia Tech student writing about technology, enterprise adoption and ideas I’m working through.{% endblock %}">
  <meta name="author" content="Arya Shah">
  <meta name="theme-color" content="#fff">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="page">
    <header class="header-wrap">
      <div class="header nu limiter">
        {% if current == "/" %}<h1 class="name">Arya Shah</h1>{% else %}<p class="name"><a href="/">Arya Shah</a></p>{% endif %}
        <nav aria-label="Main">
          <ul>
            {% for label, href in nav %}
            <li><a href="{{ href }}"{% if current == href %} aria-current="page"{% endif %}>{{ label }}</a></li>
            {% endfor %}
          </ul>
        </nav>
      </div>
    </header>
    <main id="main" class="content limiter" tabindex="-1">
      {% block main %}{% endblock %}
    </main>
  </div>
</body>
</html>
