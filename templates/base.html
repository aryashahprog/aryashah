<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Arya Shah{% endblock %}</title>
  <meta name="description" content="{% block description %}Arya Shah: Georgia Tech student writing about technology, enterprise adoption and ideas I’m working through.{% endblock %}">
  <meta name="author" content="Arya Shah">
  <meta name="theme-color" content="#fff">
  {% if canonical_url %}
  <link rel="canonical" href="{{ canonical_url }}">
  <meta property="og:site_name" content="Arya Shah">
  <meta property="og:type" content="{{ og_type }}">
  <meta property="og:title" content="{{ self.title() | striptags }}">
  <meta property="og:description" content="{{ self.description() | striptags }}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:image" content="{{ site_url }}/social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Arya Shah: technology, research and working theses.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ self.title() | striptags }}">
  <meta name="twitter:description" content="{{ self.description() | striptags }}">
  <meta name="twitter:image" content="{{ site_url }}/social-preview.png">
  <meta name="twitter:image:alt" content="Arya Shah: technology, research and working theses.">
  {% endif %}
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  {% block head %}{% endblock %}
  {% if goatcounter_code and analytics_enabled %}<script src="/analytics.js" defer data-site="{{ site_url }}" data-goatcounter="https://{{ goatcounter_code }}.goatcounter.com/count"></script>{% endif %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip" href="#main">Skip to content</a>
  <div class="page">
    <header class="header-wrap">
      <div class="header nu limiter">
        <p class="name"><a href="/">Arya Shah</a></p>
        <nav aria-label="Main">
          <ul>
            {% for label, href in nav %}
            <li><a href="{{ href }}"{% if current == href %} aria-current="page"{% endif %}>{{ label }}</a></li>
            {% endfor %}
          </ul>
        </nav>
      </div>
    </header>
    <main id="main" class="content limiter" tabindex="-1">
      {% block main %}{% endblock %}
    </main>
    <footer class="footer limiter">
      <a class="footer-name" href="/">Arya Shah</a>
      <div class="footer-links">
        <a href="mailto:aryavms@outlook.com">Email</a>
        <a href="https://www.linkedin.com/in/aryashahcy/">LinkedIn</a>
        <a href="https://x.com/aryashah0">X</a>
      </div>
    </footer>
  </div>
</body>
</html>
