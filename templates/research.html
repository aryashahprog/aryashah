{% extends "base.html" %}
{% block title %}{{ page.title }} · Arya Shah{% endblock %}
{% block description %}{{ page.description }}{% endblock %}
{% block main %}
<article>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.authors }}</p>
  {{ page.html | safe }}
  <p><a href="{{ page.poster }}" type="application/pdf">Poster PDF</a> · <a href="{{ page.paper }}" type="application/pdf">Paper PDF</a></p>
</article>
{% endblock %}
