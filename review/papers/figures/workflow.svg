<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="11" fill="#000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="20" y="8" width="600" height="50" rx="4" fill="#f2f2f2" stroke="#000"/>
  <text x="320" y="28" text-anchor="middle" font-weight="bold">ABCD Study: cohort described on the poster (n = 3,135)</text>
  <text x="320" y="46" text-anchor="middle">Full-term 2,252 · Moderately premature (32–37 weeks) 731 · Very premature (&lt;32 weeks) 152</text>

  <g stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M160,58 L160,82"/>
    <path d="M480,58 L480,82"/>
    <path d="M160,148 L160,172"/>
    <path d="M480,148 L480,172"/>
    <path d="M160,234 L160,258"/>
    <path d="M480,234 L480,258"/>
  </g>

  <rect x="20" y="84" width="280" height="64" rx="4" fill="#fff" stroke="#0072B2" stroke-width="1.5"/>
  <text x="160" y="102" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0072B2" letter-spacing="0.08em">BRAIN STRUCTURE</text>
  <text x="160" y="120" text-anchor="middle" font-weight="bold">Structural MRI</text>
  <text x="160" y="136" text-anchor="middle">moo-ICAr: grey matter volume, 100 regions</text>

  <rect x="340" y="84" width="280" height="64" rx="4" fill="#fff" stroke="#D55E00" stroke-width="1.5"/>
  <text x="480" y="102" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#D55E00" letter-spacing="0.08em">COGNITION</text>
  <text x="480" y="120" text-anchor="middle" font-weight="bold">NIH Toolbox</text>
  <text x="480" y="136" text-anchor="middle">7 cognitive tests, including Picture Vocabulary</text>

  <rect x="20" y="174" width="280" height="60" rx="4" fill="#fff" stroke="#0072B2" stroke-width="1.5"/>
  <text x="160" y="192" text-anchor="middle" font-weight="bold">Linear mixed-effects models</text>
  <text x="160" y="208" text-anchor="middle">GM ~ group + sex + gestational age</text>
  <text x="160" y="224" text-anchor="middle">random effect: site</text>

  <rect x="340" y="174" width="280" height="60" rx="4" fill="#fff" stroke="#D55E00" stroke-width="1.5"/>
  <text x="480" y="192" text-anchor="middle" font-weight="bold">Linear mixed-effects models</text>
  <text x="480" y="208" text-anchor="middle">Cognition ~ group + sex + gestational age</text>
  <text x="480" y="224" text-anchor="middle">random effect: site</text>

  <rect x="20" y="260" width="280" height="46" rx="4" fill="#E8F1F8" stroke="#0072B2" stroke-width="1.5"/>
  <text x="160" y="279" text-anchor="middle" font-weight="bold">5 regions differ by group</text>
  <text x="160" y="295" text-anchor="middle">Cuneus reported here (Figure 2)</text>

  <rect x="340" y="260" width="280" height="46" rx="4" fill="#FBEDE5" stroke="#D55E00" stroke-width="1.5"/>
  <text x="480" y="279" text-anchor="middle" font-weight="bold">Group differences in scores</text>
  <text x="480" y="295" text-anchor="middle">Picture Vocabulary reported here (Figure 3)</text>

  <text x="320" y="338" text-anchor="middle" font-size="10" fill="#444">Group: full-term, moderately premature or very premature; full-term is the reference group.</text>
  <text x="320" y="356" text-anchor="middle" font-size="10" fill="#444">Arrows show the order of analysis steps, not causal relationships.</text>
</svg>
