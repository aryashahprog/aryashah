<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 752" width="360" height="752" role="img" aria-labelledby="t d">
  <title id="t">From messy information to a reviewed plan</title>
  <desc id="d">Messy operational information, from emails, spreadsheets and policies, goes to an agent that drafts candidate objectives and constraints. A person approves, edits or rejects the draft. The reviewed formulation feeds four layers: a world model of the operation as it is, forecasts, behavior models of how people actually act, and an optimizer that draws on the other three. The reviewed plan goes into use with changes reversible, and drift and exceptions from deployment feed the next draft.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0072B2"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #111; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 13.5px; fill: #444; }
    .i { font-size: 13px; fill: #666; font-style: italic; }
    .k { font-size: 11px; letter-spacing: 0.08em; fill: #555; font-weight: 600; }
    .l { font-size: 13px; fill: #0072B2; }
    rect { fill: #fff; stroke: #111; stroke-width: 1.25; }
    rect.g { fill: #f6f6f6; stroke: #888; stroke-dasharray: 4 3; }
  </style>
  <rect width="360" height="752" fill="#fff" stroke="none"/>
  <text class="k" x="20" y="24">FROM MESSY INFORMATION TO A REVIEWED PLAN</text>
  <rect x="20" y="40" width="290" height="69" rx="4"/>
  <text class="h" x="32" y="64">Messy operational information</text>
  <text class="s" x="32" y="88">Emails, spreadsheets, policies</text>
  <path d="M165.0 112V132" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="20" y="135" width="290" height="69" rx="4"/>
  <text class="h" x="32" y="159">Agent drafts the formulation</text>
  <text class="s" x="32" y="183">Candidate objectives and constraints</text>
  <path d="M165.0 207V227" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="20" y="230" width="290" height="69" rx="4"/>
  <text class="h" x="32" y="254">Human review</text>
  <text class="s" x="32" y="278">Approve, edit or reject</text>
  <path d="M165 302V322" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <rect class="g" x="20" y="325" width="290" height="266" rx="4"/>
  <text class="k" x="32" y="347">FOUR LAYERS</text>
  <rect x="32" y="359" width="129" height="106" rx="4"/>
  <text class="h" x="44" y="383">World model</text>
  <text class="s" x="44" y="407">The operation</text>
  <text class="s" x="44" y="425">as it is</text>
  <rect x="169" y="359" width="129" height="106" rx="4"/>
  <text class="h" x="181" y="383">Forecasts</text>
  <text class="s" x="181" y="407">What is likely</text>
  <text class="s" x="181" y="425">to come</text>
  <rect x="32" y="473" width="129" height="106" rx="4"/>
  <text class="h" x="44" y="497">Behavior</text>
  <text class="h" x="44" y="516">models</text>
  <text class="s" x="44" y="540">How people</text>
  <text class="s" x="44" y="558">actually act</text>
  <rect x="169" y="473" width="129" height="106" rx="4"/>
  <text class="h" x="181" y="497">Optimizer</text>
  <text class="s" x="181" y="521">Draws on the</text>
  <text class="s" x="181" y="539">other three</text>
  <path d="M165 594V614" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="20" y="617" width="290" height="69" rx="4"/>
  <text class="h" x="32" y="641">Reviewed plan in use</text>
  <text class="s" x="32" y="665">Changes stay reversible</text>
  <path d="M310 651.5H336V169.5H314" fill="none" stroke="#0072B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text class="l" x="20" y="716">Drift and exceptions from deployment</text>
  <text class="l" x="20" y="734">feed the next draft.</text>
</svg>
