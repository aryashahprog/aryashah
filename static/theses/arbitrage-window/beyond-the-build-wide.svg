<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 297" width="640" height="297" role="img" aria-labelledby="t d">
  <title id="t">What cheaper code does and doesn&#x27;t change</title>
  <desc id="d">Building the first version is much cheaper with AI coding tools. Still needed for a durable product: distribution, who hears about it; domain access, knowing which problem to solve; integration, fitting the systems people use; maintenance, keeping up as those change; and trust, meaning support, reliability and care with data.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0072B2"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #111; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 13.5px; fill: #444; }
    .i { font-size: 13px; fill: #666; font-style: italic; }
    .k { font-size: 11px; letter-spacing: 0.08em; fill: #555; font-weight: 600; }
    .l { font-size: 13px; fill: #0072B2; }
    rect { fill: #fff; stroke: #111; stroke-width: 1.25; }
    rect.g { fill: #f6f6f6; stroke: #888; stroke-dasharray: 4 3; }
  </style>
  <rect width="640" height="297" fill="#fff" stroke="none"/>
  <text class="k" x="20" y="24">WHAT CHEAPER CODE DOES AND DOESN&#x27;T CHANGE</text>
  <rect x="20" y="40" width="600" height="69" rx="4"/>
  <text class="h" x="32" y="64">Building the first version</text>
  <text class="s" x="32" y="88">Much cheaper with AI coding tools</text>
  <text class="k" x="20" y="139">STILL NEEDED FOR A DURABLE PRODUCT</text>
  <rect x="20" y="153" width="113" height="124" rx="4"/>
  <text class="h" x="32" y="177">Distribution</text>
  <text class="s" x="32" y="201">Who hears</text>
  <text class="s" x="32" y="219">about it</text>
  <rect x="141" y="153" width="113" height="124" rx="4"/>
  <text class="h" x="153" y="177">Domain</text>
  <text class="h" x="153" y="196">access</text>
  <text class="s" x="153" y="220">Knowing which</text>
  <text class="s" x="153" y="238">problem to</text>
  <text class="s" x="153" y="256">solve</text>
  <rect x="262" y="153" width="113" height="124" rx="4"/>
  <text class="h" x="274" y="177">Integration</text>
  <text class="s" x="274" y="201">Fitting the</text>
  <text class="s" x="274" y="219">systems</text>
  <text class="s" x="274" y="237">people use</text>
  <rect x="383" y="153" width="113" height="124" rx="4"/>
  <text class="h" x="395" y="177">Maintenance</text>
  <text class="s" x="395" y="201">Keeping up as</text>
  <text class="s" x="395" y="219">those change</text>
  <rect x="504" y="153" width="113" height="124" rx="4"/>
  <text class="h" x="516" y="177">Trust</text>
  <text class="s" x="516" y="201">Support,</text>
  <text class="s" x="516" y="219">reliability,</text>
  <text class="s" x="516" y="237">data care</text>
</svg>
