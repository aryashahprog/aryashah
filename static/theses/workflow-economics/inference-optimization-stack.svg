<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 399" width="360" height="399" role="img" aria-labelledby="t d">
  <title id="t">The LLM inference optimization stack</title>
  <desc id="d">Layer 1, model: compress and redesign the weights, through pruning, quantization, distillation and mixture-of-experts or state-space architectures. Layer 2, runtime: serve and decode faster per request, through serving engines, speculative decoding, KV caching and kernels. Layer 3, infrastructure: share and route the cluster, through GPU orchestration, utilization and compute marketplaces.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0072B2"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #111; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 13.5px; fill: #444; }
    .i { font-size: 13px; fill: #666; font-style: italic; }
    .k { font-size: 11px; letter-spacing: 0.08em; fill: #555; font-weight: 600; }
    .l { font-size: 13px; fill: #0072B2; }
    rect { fill: #fff; stroke: #111; stroke-width: 1.25; }
    rect.g { fill: #f6f6f6; stroke: #888; stroke-dasharray: 4 3; }
  </style>
  <rect width="360" height="399" fill="#fff" stroke="none"/>
  <text class="k" x="20" y="24">THE LLM INFERENCE OPTIMIZATION STACK</text>
  <rect x="20" y="40" width="320" height="105" rx="4"/>
  <text class="h" x="32" y="64">Layer 1: Model</text>
  <text class="s" x="32" y="88">Compress and redesign the weights</text>
  <text class="i" x="32" y="106">Pruning, quantization, distillation, MoE and</text>
  <text class="i" x="32" y="124">SSM architectures</text>
  <rect x="20" y="157" width="320" height="105" rx="4"/>
  <text class="h" x="32" y="181">Layer 2: Runtime</text>
  <text class="s" x="32" y="205">Serve and decode faster, per request</text>
  <text class="i" x="32" y="223">Serving engines, speculative decoding, KV</text>
  <text class="i" x="32" y="241">cache, kernels</text>
  <rect x="20" y="274" width="320" height="105" rx="4"/>
  <text class="h" x="32" y="298">Layer 3: Infrastructure</text>
  <text class="s" x="32" y="322">Share and route the cluster</text>
  <text class="i" x="32" y="340">GPU orchestration, utilization, compute</text>
  <text class="i" x="32" y="358">marketplaces</text>
</svg>
