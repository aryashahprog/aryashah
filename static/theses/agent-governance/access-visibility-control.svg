<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 313" width="360" height="313" role="img" aria-labelledby="t d">
  <title id="t">Three questions for governing agents</title>
  <desc id="d">Access: what can each agent reach, and on whose authority? Visibility: what is it doing, and can anyone see it? Control: who can stop it, and how quickly?</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0072B2"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #111; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 13.5px; fill: #444; }
    .i { font-size: 13px; fill: #666; font-style: italic; }
    .k { font-size: 11px; letter-spacing: 0.08em; fill: #555; font-weight: 600; }
    .l { font-size: 13px; fill: #0072B2; }
    rect { fill: #fff; stroke: #111; stroke-width: 1.25; }
    rect.g { fill: #f6f6f6; stroke: #888; stroke-dasharray: 4 3; }
  </style>
  <rect width="360" height="313" fill="#fff" stroke="none"/>
  <text class="k" x="20" y="24">THREE QUESTIONS FOR GOVERNING AGENTS</text>
  <rect x="20" y="40" width="320" height="87" rx="4"/>
  <text class="h" x="32" y="64">Access</text>
  <text class="s" x="32" y="88">What can each agent reach, and on whose</text>
  <text class="s" x="32" y="106">authority?</text>
  <rect x="20" y="141" width="320" height="69" rx="4"/>
  <text class="h" x="32" y="165">Visibility</text>
  <text class="s" x="32" y="189">What is it doing, and can anyone see it?</text>
  <rect x="20" y="224" width="320" height="69" rx="4"/>
  <text class="h" x="32" y="248">Control</text>
  <text class="s" x="32" y="272">Who can stop it, and how quickly?</text>
</svg>
