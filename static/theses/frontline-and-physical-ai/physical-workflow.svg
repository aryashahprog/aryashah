  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #111; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 13.5px; fill: #444; }
    .i { font-size: 13px; fill: #666; font-style: italic; }
    .k { font-size: 11px; letter-spacing: 0.08em; fill: #555; font-weight: 600; }
    .l { font-size: 13px; fill: #0072B2; }
    rect { fill: #fff; stroke: #111; stroke-width: 1.25; }
    rect.g { fill: #f6f6f6; stroke: #888; stroke-dasharray: 4 3; }
  </style>
  <rect width="360" height="355" fill="#fff" stroke="none"/>
  <text class="k" x="20" y="24">CAPTURE, LEARN, GUIDE, CHECK</text>
  <rect x="20" y="40" width="270" height="69" rx="4"/>
  <text class="h" x="32" y="64">1. Observe work</text>
  <text class="s" x="32" y="88">First-person task context</text>
  <path d="M155.0 112V136" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="20" y="139" width="270" height="69" rx="4"/>
  <text class="h" x="32" y="163">2. Learn expertise</text>
  <text class="s" x="32" y="187">Expert reasoning and outcomes</text>
  <path d="M155.0 211V235" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="20" y="238" width="270" height="69" rx="4"/>
  <text class="h" x="32" y="262">3. Guide execution</text>
