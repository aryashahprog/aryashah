<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 355" width="360" height="355" role="img" aria-labelledby="t d">
  <title id="t">Capture, learn, guide, check</title>
  <desc id="d">1. Observe work, capturing first-person task context. 2. Learn expertise from expert reasoning and outcomes. 3. Guide execution and check the next task. Verified outcomes feed back to improve the next procedure.</desc>
