<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" width="360" height="410" role="img" aria-labelledby="t d">
  <title id="t">Proposed physical workflow intelligence loop</title>
  <desc id="d">A proposed three-step loop, not measured evidence: observe work, learn expertise, guide execution, with verified outcomes feeding back to improve the next procedure.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0072B2"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #111; }
    .h { font-size: 16px; font-weight: 600; }
    .s { font-size: 14px; fill: #444; }
    .k { font-size: 11px; letter-spacing: 0.08em; fill: #555; }
    .l { font-size: 13px; fill: #0072B2; }
    rect { fill: #fff; stroke: #111; stroke-width: 1.25; }
  </style>
  <rect x="0.5" y="0.5" width="359" height="409" fill="#fff" stroke="none"/>
  <text class="k" x="20" y="24">PROPOSED WORKFLOW · NOT MEASURED EVIDENCE</text>
  <rect x="20" y="44" width="260" height="68" rx="4"/>
  <text class="h" x="36" y="72">1. Observe work</text>
  <text class="s" x="36" y="96">First-person task context</text>
  <path d="M150 112V146" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="20" y="150" width="260" height="68" rx="4"/>
  <text class="h" x="36" y="178">2. Learn expertise</text>
  <text class="s" x="36" y="202">Expert reasoning and outcomes</text>
  <path d="M150 218V252" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="20" y="256" width="260" height="68" rx="4"/>
  <text class="h" x="36" y="284">3. Guide execution</text>
  <text class="s" x="36" y="308">Check the next task</text>
  <path d="M280 290H318V78H284" fill="none" stroke="#0072B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text class="l" x="20" y="356">Dashed loop: verified outcomes</text>
  <text class="l" x="20" y="374">improve the next procedure.</text>
</svg>
