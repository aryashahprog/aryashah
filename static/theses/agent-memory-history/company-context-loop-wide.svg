<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" width="640" height="285" role="img" aria-labelledby="t d">
  <title id="t">The company keeps what its workflows learn</title>
  <desc id="d">Model access, rented and replaceable, powers workflow execution, where agents complete real tasks. Corrections, rules and outcomes are retained as company context with provenance and permissions. The next run uses what was learned, and feedback from each run loops back into execution.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0072B2"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #111; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 13.5px; fill: #444; }
    .i { font-size: 13px; fill: #666; font-style: italic; }
    .k { font-size: 11px; letter-spacing: 0.08em; fill: #555; font-weight: 600; }
    .l { font-size: 13px; fill: #0072B2; }
    rect { fill: #fff; stroke: #111; stroke-width: 1.25; }
    rect.g { fill: #f6f6f6; stroke: #888; stroke-dasharray: 4 3; }
  </style>
  <rect width="640" height="285" fill="#fff" stroke="none"/>
  <text class="k" x="20" y="24">THE COMPANY KEEPS WHAT ITS WORKFLOWS LEARN</text>
  <rect x="20" y="40" width="134" height="179" rx="4"/>
  <text class="h" x="32" y="64">1. Model</text>
  <text class="h" x="32" y="83">access</text>
  <text class="s" x="32" y="107">Rented and</text>
  <text class="s" x="32" y="125">replaceable</text>
  <rect x="174" y="40" width="134" height="179" rx="4"/>
  <text class="h" x="186" y="64">2. Workflow</text>
  <text class="h" x="186" y="83">execution</text>
  <text class="s" x="186" y="107">Agents complete</text>
  <text class="s" x="186" y="125">real tasks</text>
  <path d="M157 129.5H171" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="328" y="40" width="134" height="179" rx="4"/>
  <text class="h" x="340" y="64">3. Retained</text>
  <text class="h" x="340" y="83">company</text>
  <text class="h" x="340" y="102">context</text>
  <text class="s" x="340" y="126">Corrections,</text>
  <text class="s" x="340" y="144">rules and</text>
  <text class="s" x="340" y="162">outcomes, with</text>
  <text class="s" x="340" y="180">provenance and</text>
  <text class="s" x="340" y="198">permissions</text>
  <path d="M311 129.5H325" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="482" y="40" width="134" height="179" rx="4"/>
  <text class="h" x="494" y="64">4. Improved</text>
  <text class="h" x="494" y="83">workflow</text>
  <text class="s" x="494" y="107">The next run</text>
  <text class="s" x="494" y="125">uses what was</text>
  <text class="s" x="494" y="143">learned</text>
  <path d="M465 129.5H479" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <path d="M549.0 219V247H241.0V223" fill="none" stroke="#0072B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text class="l" x="253.0" y="269">Feedback from each run improves the next one.</text>
</svg>
