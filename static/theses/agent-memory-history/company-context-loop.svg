<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 472" width="360" height="472" role="img" aria-labelledby="t d">
  <title id="t">The company keeps what its workflows learn</title>
  <desc id="d">Model access, rented and replaceable, powers workflow execution, where agents complete real tasks. Corrections, rules and outcomes are retained as company context with provenance and permissions. The next run uses what was learned, and feedback from each run loops back into execution.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0072B2"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #111; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 13.5px; fill: #444; }
    .i { font-size: 13px; fill: #666; font-style: italic; }
    .k { font-size: 11px; letter-spacing: 0.08em; fill: #555; font-weight: 600; }
    .l { font-size: 13px; fill: #0072B2; }
    rect { fill: #fff; stroke: #111; stroke-width: 1.25; }
    rect.g { fill: #f6f6f6; stroke: #888; stroke-dasharray: 4 3; }
  </style>
  <rect width="360" height="472" fill="#fff" stroke="none"/>
  <text class="k" x="20" y="24">THE COMPANY KEEPS WHAT ITS WORKFLOWS LEARN</text>
  <rect x="20" y="40" width="270" height="69" rx="4"/>
  <text class="h" x="32" y="64">1. Model access</text>
  <text class="s" x="32" y="88">Rented and replaceable</text>
  <path d="M155.0 112V136" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="20" y="139" width="270" height="69" rx="4"/>
  <text class="h" x="32" y="163">2. Workflow execution</text>
  <text class="s" x="32" y="187">Agents complete real tasks</text>
  <path d="M155.0 211V235" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="20" y="238" width="270" height="87" rx="4"/>
  <text class="h" x="32" y="262">3. Retained company context</text>
  <text class="s" x="32" y="286">Corrections, rules and outcomes,</text>
  <text class="s" x="32" y="304">with provenance and permissions</text>
  <path d="M155.0 328V352" stroke="#111" stroke-width="1.25" marker-end="url(#a)"/>
  <rect x="20" y="355" width="270" height="69" rx="4"/>
  <text class="h" x="32" y="379">4. Improved workflow</text>
  <text class="s" x="32" y="403">The next run uses what was learned</text>
  <path d="M290 389.5H326V173.5H294" fill="none" stroke="#0072B2" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text class="l" x="20" y="454">Feedback from each run improves the next one.</text>
</svg>
